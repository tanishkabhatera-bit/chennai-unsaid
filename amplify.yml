version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node 20.9+.
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        # Amplify console variables reach the build, not the SSR runtime, so copy the ones the app reads.
        # AWS access itself comes from the app's compute role, so no keys are needed here.
        - env | grep -E '^(APP_AWS_REGION|BEDROCK_MODEL_ID|SPOTS_REVIEW_KEY)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
